[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The ERC-8183 reference escrow (contracts/reference/) needs these two. The project solc is
# 0.8.28 so that file compiles with no per-invocation flags; every other pragma is ^0.8.24.
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"

[etherscan]
arc_testnet = { key = "", url = "https://testnet.arcscan.app" }
arc_mainnet = { key = "", url = "https://explorer.arc.io" }
